<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI TikTok Live Blessing Stage</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0d0b09;
      color: #f7efe2;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      gap: 10px;
    }

    .stage {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #b38738;
      background: url("bg_hall.png") center / cover no-repeat,
                  linear-gradient(180deg, #2e1b0d 0%, #120a05 100%);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.75);
    }

    .carpet-sides {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 88%;
      height: 56%;
      object-fit: fill;
      z-index: 1;
      pointer-events: none;
    }

    .carpet-center {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 20%;
      height: 58%;
      object-fit: fill;
      z-index: 2;
      pointer-events: none;
    }

    .blessing-card {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 90%;
      background: rgba(20, 10, 4, 0.9);
      border: 1px solid #f0c25b;
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      z-index: 20;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .blessing-card.active { opacity: 1; }
    .blessing-title { font-size: 12px; color: #ffd97d; font-weight: 700; }
    .blessing-text { font-size: 11px; color: #fff7e6; margin-top: 2px; line-height: 1.35; }

    .devotee {
      position: absolute;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      transition: left 0.85s ease, top 0.85s ease;
    }

    .devotee img {
      width: 28px;
      height: 28px;
      object-fit: contain;
      pointer-events: none;
    }

    .devotee.bowing img {
      animation: bowAnim 0.85s ease-in-out infinite alternate;
    }

    .devotee-name {
      position: absolute;
      top: -13px;
      background: rgba(0, 0, 0, 0.78);
      color: #ffe599;
      font-size: 8px;
      padding: 1px 4px;
      border-radius: 4px;
      white-space: nowrap;
    }

    @keyframes bowAnim {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(2px) scale(1.06); }
    }

    .controls {
      width: 100%;
      max-width: 420px;
      background: #1b1714;
      border: 1px solid #382f26;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row { display: flex; gap: 8px; }
    input, select, button {
      border-radius: 8px;
      border: 1px solid #4c4033;
      padding: 8px 10px;
      font-size: 12px;
    }

    input, select {
      background: #110e0c;
      color: #fff;
      flex: 1;
    }

    button {
      background: linear-gradient(90deg, #e5a93c, #c47d19);
      color: #191105;
      font-weight: 700;
      border: none;
      cursor: pointer;
    }

    .btn-dark {
      background: #2c2620;
      color: #f5efe6;
      border: 1px solid #4c4033;
    }

    .feed {
      background: #110e0c;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      color: #a9e5a9;
      max-height: 90px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <img class="carpet-sides" src="carpet_sides.png" alt="Side Carpets" />
    <img class="carpet-center" src="carpet_center.png" alt="Center Carpet" />
    <div class="blessing-card" id="blessingCard">
      <div class="blessing-title" id="blessingTitle"></div>
      <div class="blessing-text" id="blessingText"></div>
    </div>
  </div>

  <div class="controls">
    <div class="row">
      <input id="viewerName" type="text" placeholder="Gift ပို့သူ နာမည် (ဥပမာ - Ko Ko)" />
      <select id="giftType">
        <option value="Rose">🌹 Rose (x1)</option>
        <option value="Lotus">🪷 Lotus (x5)</option>
        <option value="Incense">🕯️ Incense (x10)</option>
        <option value="Universe">🌌 Universe (x50)</option>
      </select>
    </div>

    <div class="row">
      <button id="sendGiftBtn">🎁 Simulate Gift</button>
      <button class="btn-dark" id="autoSimBtn">▶ Auto Live Sim</button>
      <button class="btn-dark" id="resetBtn">↺ Reset</button>
    </div>

    <div class="row">
      <input id="wsUrl" type="text" placeholder="Optional WebSocket URL (ws://localhost:8080)" />
      <button class="btn-dark" id="connectWsBtn">Connect</button>
    </div>

    <div class="feed" id="feed">Live event စောင့်ဆိုင်းနေပါသည်...</div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const blessingCard = document.getElementById("blessingCard");
    const blessingTitle = document.getElementById("blessingTitle");
    const blessingText = document.getElementById("blessingText");
    const viewerNameInput = document.getElementById("viewerName");
    const giftTypeSelect = document.getElementById("giftType");
    const feed = document.getElementById("feed");

    const sampleNames = ["Kyaw Kyaw", "Su Su", "Min Min", "Thandar", "Aung Aung", "Hnin Wai", "Zayar", "Mya Mya"];
    const blessings = [
      "ကိုယ်ကျန်းမာ စိတ်ချမ်းသာ၍ လိုအင်ဆန္ဒများ ပြည့်ဝပါစေ။",
      "မိသားစု စီးပွားတိုးတက်ပြီး ဘေးရန်ကင်းကွာပါစေ။",
      "ဉာဏ်ပညာထွန်းကား၍ ကောင်းကျိုးလိုရာဆန္ဒများ အမြန်ပြည့်စုံပါစေ။"
    ];

    const spots = [];
    for (let r = 0; r < 6; r++) {
      const y = 52 + r * 7.2;
      for (let c = 0; c < 4; c++) {
        spots.push({ x: 11 + c * 7.2, y, taken: false });
        spots.push({ x: 67 + c * 7.2, y, taken: false });
      }
    }

    let placed = [];
    let autoTimer = null;
    let socket = null;

    function logEvent(msg) {
      const t = new Date().toLocaleTimeString("en-GB", { hour12: false });
      feed.innerHTML = `<div>[${t}] ${msg}</div>` + feed.innerHTML;
    }

    function speakText(text) {
      if (!("speechSynthesis" in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function triggerBlessing(name, gift) {
      const quote = blessings[Math.floor(Math.random() * blessings.length)];
      blessingTitle.textContent = `🎁 ${name} sent ${gift}`;
      blessingText.textContent = quote;
      blessingCard.classList.add("active");
      speakText(`${name} sent ${gift}. ${quote}`);

      setTimeout(() => {
        blessingCard.classList.remove("active");
      }, 3200);
    }

    function handleGiftEvent(name, gift) {
      const cleanName = (name || "").trim() || sampleNames[Math.floor(Math.random() * sampleNames.length)];
      const cleanGift = gift || "Rose";

      let spot = spots.find(s => !s.taken);
      if (!spot && placed.length > 0) {
        const oldest = placed.shift();
        oldest.el.remove();
        oldest.spot.taken = false;
        spot = oldest.spot;
      }
      if (!spot) return;

      spot.taken = true;
      const isMan = Math.random() > 0.5;
      const imgSrc = isMan ? "man_bow.png" : "woman_bow.png";

      const el = document.createElement("div");
      el.className = "devotee";
      el.style.left = "50%";
      el.style.top = "95%";
      el.innerHTML = `<span class="devotee-name">${cleanName}</span><img src="${imgSrc}" alt="${cleanName}" />`;
      stage.appendChild(el);

      requestAnimationFrame(() => {
        el.style.left = `${spot.x}%`;
        el.style.top = `${spot.y}%`;
      });

      setTimeout(() => {
        el.classList.add("bowing");
      }, 850);

      placed.push({ el, spot });
      triggerBlessing(cleanName, cleanGift);
      logEvent(`${cleanName} (${cleanGift}) ဝင်ရောက်ရှိခိုးပါသည်။`);
    }

    document.getElementById("sendGiftBtn").addEventListener("click", () => {
      handleGiftEvent(viewerNameInput.value, giftTypeSelect.value);
      viewerNameInput.value = "";
    });

    document.getElementById("autoSimBtn").addEventListener("click", (e) => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        e.target.textContent = "▶ Auto Live Sim";
        logEvent("Auto Live Sim ရပ်လိုက်ပါပြီ။");
      } else {
        autoTimer = setInterval(() => {
          const gifts = ["Rose", "Lotus", "Incense", "Universe"];
          handleGiftEvent("", gifts[Math.floor(Math.random() * gifts.length)]);
        }, 2800);
        e.target.textContent = "❚❚ Stop Sim";
        logEvent("Auto Live Sim စတင်ပါပြီ။");
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      placed.forEach(item => item.el.remove());
      placed = [];
      spots.forEach(s => (s.taken = false));
      logEvent("Stage ကို ပြန်ရှင်းလင်းလိုက်ပါပြီ။");
    });

    document.getElementById("connectWsBtn").addEventListener("click", () => {
      const url = document.getElementById("wsUrl").value.trim();
      if (!url) return;
      if (socket) socket.close();
      socket = new WebSocket(url);
      socket.onopen = () => logEvent(`WebSocket ချိတ်ဆက်ပြီးပါပြီ: ${url}`);
      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.username || data.giftName) {
            handleGiftEvent(data.username, data.giftName);
          }
        } catch (_) {}
      };
      socket.onclose = () => logEvent("WebSocket ချိတ်ဆက်မှု ပိတ်သွားပါပြီ။");
    });
  </script>
</body>
</html>
