<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buddha Hall Stage - 9:16 TikTok Live</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #12100e;
      color: #f5efe6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 12px;
    }

    .stage-wrapper {
      width: 100%;
      max-width: 390px;
      aspect-ratio: 9 / 16;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #8a6428;
      background: #1c1108;
      box-shadow: 0 12px 30px rgba(0,0,0,0.65);
    }

    /* ၁။ ဘုရားရှင် + ပလ္လင် + နောက်ခံ */
    .hall-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
      pointer-events: none;
    }

    /* ၂။ ဘယ်/ညာ ၂ ဖက် ထိုင်မည့် ကောဇောများ */
    .side-carpets {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 54%;
      object-fit: fill;
      mix-blend-mode: multiply;
      z-index: 2;
      pointer-events: none;
    }

    /* ၃။ အလယ် ကောဇောတန်း */
    .center-carpet {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 22%;
      height: 53%;
      object-fit: fill;
      mix-blend-mode: multiply;
      z-index: 3;
      pointer-events: none;
    }

    /* ၄။ လူတစ်ဦးချင်းစီ (မိန်းမ / ယောကျ်ားလေး) */
    .devotee {
      position: absolute;
      width: 38px;
      height: 38px;
      background-size: contain;
      background-position: center bottom;
      background-repeat: no-repeat;
      mix-blend-mode: multiply;
      transform: translate(-50%, -50%) scale(var(--dev-scale, 1));
      z-index: 6;
      display: flex;
      justify-content: center;
    }
    .devotee.female { background-image: url('woman_bow.png'); }
    .devotee.male { background-image: url('man_bow.png'); }
    .devotee.walking { animation: walkBob 0.3s ease-in-out infinite alternate; }

    .name-tag {
      position: absolute;
      top: -14px;
      font-size: 9px;
      background: rgba(0, 0, 0, 0.85);
      color: #ffeaa7;
      padding: 1px 4px;
      border-radius: 4px;
      white-space: nowrap;
      mix-blend-mode: normal;
    }

    .panel {
      width: 100%;
      max-width: 390px;
      background: #1e1b18;
      border: 1px solid #3b332a;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .row { display: flex; gap: 8px; }
    input, select {
      flex: 1;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid #52473a;
      background: #14110f;
      color: #fff;
      font-size: 12px;
    }
    .btn-enter {
      width: 100%;
      padding: 11px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #e5a93c, #c9821e);
      color: #1a1205;
      font-weight: 700;
      cursor: pointer;
    }
    .btn-clear {
      width: 100%;
      padding: 8px;
      border: 1px solid #52473a;
      border-radius: 8px;
      background: #2a2520;
      color: #f5efe6;
      font-size: 12px;
      cursor: pointer;
    }

    @keyframes walkBob {
      0% { margin-top: 0px; }
      100% { margin-top: -3px; }
    }
  </style>
</head>
<body>

  <div class="stage-wrapper" id="stage">
    <img class="hall-bg" src="bg_hall.png" alt="ဘုရားရှင် ပလ္လင်နှင့် နောက်ခံ" />
    <img class="side-carpets" src="carpet_sides.png" alt="ဘယ်ညာ ကောဇောများ" />
    <img class="center-carpet" src="carpet_center.png" alt="အလယ် ကောဇောတန်း" />
  </div>

  <div class="panel">
    <div class="row">
      <input type="text" id="donorName" placeholder="နာမည်ထည့်ပါ (ဥပမာ- မောင်မောင်)" />
      <select id="genderSelect">
        <option value="random">ကျပန်း (မ/ကျား)</option>
        <option value="female">မိန်းမ (၁ ဦး)</option>
        <option value="male">ယောကျ်ားလေး (၁ ဦး)</option>
      </select>
    </div>
    <button type="button" class="btn-enter" id="enterBtn">✦ Enter (ဝင်ရောက်ဦးချ)</button>
    <button type="button" class="btn-clear" id="clearBtn">အားလုံးရှင်း (Clear)</button>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const donorInput = document.getElementById("donorName");
    const genderSelect = document.getElementById("genderSelect");
    const enterBtn = document.getElementById("enterBtn");
    const clearBtn = document.getElementById("clearBtn");

    const seats = [];
    let spawned = [];
    let count = 0;

    function buildSeats() {
      seats.length = 0;
      const rows = 8;
      const cols = 3;
      for (let r = 0; r < rows; r++) {
        const t = r / (rows - 1); // 0 = အပေါ်ဆုံးတန်း, 1 = အောက်ဆုံးတန်း
        const y = 51 + t * 41;
        const scale = Number((0.55 + t * 0.52).toFixed(2));
        const gap = 5.2 + t * 2.5;

        // ဘယ်ဘက် ကောဇောပေါ် နေရာများ
        const leftAnchor = 33 - t * 14;
        for (let c = 0; c < cols; c++) {
          const x = leftAnchor - (cols - 1 - c) * gap;
          seats.push({ side: "L", x, y, scale, taken: false });
        }

        // ညာဘက် ကောဇောပေါ် နေရာများ
        const rightAnchor = 67 + t * 14;
        for (let c = 0; c < cols; c++) {
          const x = rightAnchor + c * gap;
          seats.push({ side: "R", x, y, scale, taken: false });
        }
      }
    }

    async function handleEnter() {
      const seat = seats.find(s => !s.taken);
      if (!seat) return;
      seat.taken = true;
      count++;

      const name = donorInput.value.trim() || `ဧည့်သည် #${count}`;
      donorInput.value = "";
      const gender = genderSelect.value === "random"
        ? (Math.random() > 0.5 ? "female" : "male")
        : genderSelect.value;

      const el = document.createElement("div");
      el.className = `devotee ${gender} walking`;
      el.innerHTML = `<span class="name-tag">${name}</span>`;
      el.style.left = "50%";
      el.style.top = "96%";
      el.style.zIndex = "10";
      el.style.setProperty("--dev-scale", "1.05");
      stage.appendChild(el);
      spawned.push(el);

      // အလယ်ကောဇောလမ်းကနေ ရှေ့သို့ လျှောက်လာခြင်း
      await new Promise(r => setTimeout(r, 50));
      el.style.transition = "left 900ms linear, top 900ms linear, transform 0.25s ease";
      el.style.left = "50%";
      el.style.top = "49%";
      el.style.setProperty("--dev-scale", "0.62");
      await new Promise(r => setTimeout(r, 950));

      // သတ်မှတ်ထားသော ဘယ်/ညာ ကောဇောနေရာသို့ ဝင်ထိုင်ခြင်း
      el.style.transition = "left 850ms ease-in-out, top 850ms ease-in-out, transform 0.25s ease";
      el.style.left = `${seat.x}%`;
      el.style.top = `${seat.y}%`;
      el.style.setProperty("--dev-scale", String(seat.scale));
      await new Promise(r => setTimeout(r, 880));

      el.classList.remove("walking");
      el.style.zIndex = String(4 + Math.round(seat.y / 10));
    }

    enterBtn.addEventListener("click", handleEnter);
    donorInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        handleEnter();
      }
    });

    clearBtn.addEventListener("click", () => {
      spawned.forEach(d => d.remove());
      spawned = [];
      seats.forEach(s => s.taken = false);
      count = 0;
    });

    buildSeats();
  </script>
</body>
  </html>
