<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buddha Hall Stage - Pixel Devotees</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background: #12100e;
      color: #f5efe6;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      gap: 14px;
    }

    /* ကျောင်းဆောင် Stage (9:16 Portrait) */
    .stage-wrapper {
      width: 100%;
      max-width: 390px;
      aspect-ratio: 9 / 16;
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid #8a6428;
      background: radial-gradient(circle at 50% 22%, #4a2d13 0%, #221208 65%, #130904 100%);
      box-shadow: 0 12px 30px rgba(0,0,0,0.65);
    }

    /* အပေါ်ပိုင်း ဘုရားရှင်နှင့် ပလ္လင် */
    .buddha-statue {
      position: absolute;
      top: 2.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 56%;
      max-height: 29%;
      object-fit: contain;
      z-index: 3;
      pointer-events: none;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.7));
    }

    /* ဘုရားပုံတော် အပေါ်မှ ညင်သာသော ရွှေရောင်အလင်း */
    .buddha-glow {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      width: 170px;
      height: 170px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 224, 115, 0.35) 0%, rgba(255, 180, 30, 0.12) 55%, transparent 75%);
      animation: auraPulse 3.2s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 2;
    }

    /* ဘုရားစင်ရှေ့ ဆီမီးနှင့် ပန်း ကပ်လှူရာနေရာ */
    .offering-altar {
      position: absolute;
      top: 32.5%;
      left: 50%;
      transform: translateX(-50%);
      width: 165px;
      height: 22px;
      background: rgba(35, 16, 8, 0.82);
      border: 1px solid rgba(224, 178, 76, 0.85);
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
      z-index: 4;
      overflow: hidden;
    }

    .altar-lamp {
      position: relative;
      width: 10px;
      height: 6px;
      background: #cd7f32;
      border-radius: 0 0 5px 5px;
      flex-shrink: 0;
      animation: popIn 0.4s ease-out;
    }
    .altar-flame {
      position: absolute;
      top: -8px;
      left: 2px;
      width: 6px;
      height: 9px;
      background: radial-gradient(circle, #fff 10%, #ffdd00 50%, #ff5500 90%);
      border-radius: 50% 50% 20% 20%;
      box-shadow: 0 0 8px #ffaa00, 0 0 12px #ff4500;
      animation: flicker 0.15s infinite alternate;
    }
    .altar-flower {
      font-size: 12px;
      line-height: 1;
      flex-shrink: 0;
      filter: drop-shadow(0 0 4px rgba(255,255,255,0.6));
      animation: popIn 0.4s ease-out;
    }
    .flying-offering {
      position: absolute;
      font-size: 18px;
      pointer-events: none;
      z-index: 10;
      animation: flyToAltar 0.85s ease-out forwards;
    }

    .incense-particle {
      position: absolute;
      top: 31%;
      left: 50%;
      font-size: 11px;
      pointer-events: none;
      z-index: 4;
      animation: floatUpSparkle 2.4s ease-out forwards;
    }

    .blessing-banner {
      position: absolute;
      top: 36.8%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(25, 10, 5, 0.9);
      border: 1px solid #f3c65f;
      color: #ffeaa7;
      font-size: 10px;
      padding: 3px 9px;
      border-radius: 999px;
      white-space: nowrap;
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .blessing-banner.show { opacity: 1; }

    /* အလယ် ကော်ဇောနီလမ်း */
    .carpet-aisle {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 28%;
      height: 58%;
      object-fit: fill;
      pointer-events: none;
      z-index: 1;
    }

    /* ဘယ်/ညာ ထိုင်ခုံ/နေရာ အမှတ်အသားများ */
    .seat-spot {
      position: absolute;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      border: 1px dashed rgba(243, 198, 95, 0.45);
      background: rgba(255, 215, 120, 0.08);
      transform: translate(-50%, -50%);
      z-index: 2;
      pointer-events: none;
    }
    .seat-spot.taken {
      border-color: rgba(243, 198, 95, 0.85);
      background: rgba(243, 198, 95, 0.22);
    }
    .hide-seats .seat-spot { display: none; }

    /* Devotee Sprite */
    .devotee {
      position: absolute;
      width: 34px;
      height: 34px;
      background-image: url('devotee_walk.png');
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      border-radius: 6px;
      transform: translate(-50%, -50%) scale(var(--dev-scale, 1));
      z-index: 6;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ကပ်လှူနေစဉ် ပုံသို့ ပြောင်းပြခြင်း */
    .devotee.offering-pose {
      background-image: url('devotee_offer.png');
      transform: translate(-50%, -48%) scale(calc(var(--dev-scale, 1) * 1.15));
    }

    /* ဦးချ / ရှိခိုး အနေအထား */
    .devotee.bowing {
      background-image: url('devotee_bow.png');
      transform: translate(-50%, -44%) scale(calc(var(--dev-scale, 1) * 0.96));
    }

    /* လမ်းလျှောက်နေစဉ် ခြေလှမ်းကြွလှုပ်မှု */
    .devotee.walking {
      background-image: url('devotee_walk.png');
      animation: walkBob 0.32s ease-in-out infinite alternate;
    }

    /* ဝတ်စုံအလိုက် အရောင်အလင်း ကွဲပြားမှု */
    .devotee.outfit-silk { filter: drop-shadow(0 0 4px rgba(255, 215, 0, 0.85)); }
    .devotee.outfit-taikpon { filter: drop-shadow(0 0 4px rgba(255, 90, 90, 0.85)); }
    .devotee.outfit-acheik { filter: drop-shadow(0 0 4px rgba(255, 105, 180, 0.85)); }

    .name-tag {
      position: absolute;
      top: -15px;
      font-size: 9px;
      background: rgba(0,0,0,0.82);
      color: #ffeaa7;
      padding: 1px 4px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .hide-names .name-tag { display: none; }

    /* Control Panel */
    .panel {
      width: 100%;
      max-width: 390px;
      background: #1e1b18;
      border: 1px solid #3b332a;
      border-radius: 14px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 11px;
    }
    .panel h2 { font-size: 16px; color: #f3c65f; }
    .hint { font-size: 12px; color: #c7bdb0; line-height: 1.4; }

    .input-row { display: flex; gap: 8px; }
    .name-input, .select-box {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid #52473a;
      background: #14110f;
      color: #fff;
      font-size: 12px;
    }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn-main {
      width: 100%;
      padding: 12px;
      font-size: 14px;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      background: linear-gradient(90deg, #e5a93c, #c9821e);
      color: #1a1205;
      cursor: pointer;
    }
    .btn-sec {
      padding: 9px;
      font-size: 12px;
      font-weight: 600;
      border: 1px solid #52473a;
      border-radius: 8px;
      background: #2a2520;
      color: #f5efe6;
      cursor: pointer;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      text-align: center;
      background: #151210;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
    }
    .stats strong { display: block; font-size: 14px; color: #f3c65f; }

    .slider-group { display: flex; flex-direction: column; gap: 4px; font-size: 12px; }
    .slider-row { display: flex; justify-content: space-between; color: #d6ccc0; }
    input[type="range"] { width: 100%; accent-color: #e5a93c; }

    .toggle-row { display: flex; align-items: center; gap: 8px; font-size: 12px; }
    .log {
      background: #14110f;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      color: #9be39b;
      max-height: 75px;
      overflow-y: auto;
    }

    @keyframes auraPulse {
      0% { transform: translateX(-50%) scale(0.95); opacity: 0.65; }
      100% { transform: translateX(-50%) scale(1.08); opacity: 1; }
    }
    @keyframes walkBob {
      0% { margin-top: 0px; }
      100% { margin-top: -3px; }
    }
    @keyframes floatUpSparkle {
      0% { transform: translate(-50%, 0) scale(0.7); opacity: 0.9; }
      100% { transform: translate(calc(-50% + var(--drift, 0px)), -55px) scale(1.2); opacity: 0; }
    }
    @keyframes flicker {
      0% { transform: scale(1) rotate(-3deg); opacity: 0.9; }
      100% { transform: scale(1.15) rotate(3deg); opacity: 1; }
    }
    @keyframes popIn {
      0% { transform: scale(0); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    @keyframes flyToAltar {
      0% { top: 43%; left: 50%; opacity: 1; transform: translate(-50%, -50%) scale(0.8); }
      100% { top: 34%; left: 50%; opacity: 0; transform: translate(-50%, -50%) scale(1.35); }
    }
  </style>
</head>
<body>

  <div class="stage-wrapper" id="stage">
    <div class="buddha-glow"></div>
    <img class="buddha-statue" src="1000141877-removebg-preview.png" alt="ဘုရားရှင်နှင့် ပလ္လင်" />
    <img class="carpet-aisle" src="1000141496-removebg-preview.png" alt="ကော်ဇောနီလမ်း" />
    <div class="offering-altar" id="offeringAltar" title="ကပ်လှူထားသော ဆီမီးနှင့် ပန်းများ"></div>
    <div class="blessing-banner" id="blessingBanner"></div>
  </div>

  <div class="panel">
    <h2>Buddha Hall Stage (Pixel Devotees + Altar)</h2>
    <p class="hint">
      နာမည်၊ ဝတ်စုံနှင့် ကပ်လှူမည့်အရာ ရွေးချယ်ပြီး Enter နှိပ်ပါ။
    </p>

    <div class="input-row">
      <input type="text" class="name-input" id="donorName" placeholder="အလှူရှင် နာမည် (ဥပမာ- မောင်မောင်)" />
    </div>

    <div class="grid-2">
      <select class="select-box" id="outfitSelect">
        <option value="random">👗 ဝတ်စုံ: ကျပန်း (Random)</option>
        <option value="outfit-yawgi">🤍 ယောဂီဝတ်စုံ</option>
        <option value="outfit-silk">💛 ရွှေပိုးထည် (အမျိုးသား)</option>
        <option value="outfit-taikpon">🖤 တိုက်ပုံနှင့် ပုဆိုး</option>
        <option value="outfit-acheik">🩷 ချိတ်ထဘီနှင့် ဇာအင်္ကျီ</option>
      </select>

      <select class="select-box" id="offeringSelect">
        <option value="both">🕯️🌸 ဆီမီး + ပန်း</option>
        <option value="lamp">🕯️ ဆီမီး သီးသန့်</option>
        <option value="flower">🌸 ပန်း သီးသန့်</option>
      </select>
    </div>

    <button class="btn-main" id="enterBtn">✦ Enter (ဝင်ရောက်ဦးချ + ကပ်လှူ)</button>

    <div class="grid-2">
      <button class="btn-sec" id="bowAllBtn">🙏 All Bow (စုပေါင်းဦးချ)</button>
      <button class="btn-sec" id="clearBtn">Clear All (အားလုံးရှင်း)</button>
    </div>

    <div class="stats">
      <div><strong id="leftCount">0 / 40</strong>Left</div>
      <div><strong id="rightCount">0 / 40</strong>Right</div>
      <div><strong id="walkingCount">0</strong>Walking</div>
    </div>

    <div class="slider-group">
      <div class="slider-row">
        <span>Walk Speed (လျှောက်နှုန်း)</span>
        <span id="speedVal">1.0x</span>
      </div>
      <input type="range" id="speedSlider" min="0.5" max="2.5" step="0.1" value="1.0" />
    </div>

    <div class="grid-2">
      <label class="toggle-row">
        <input type="checkbox" id="voiceToggle" checked />
        <span>AI Voice Prayer</span>
      </label>

      <label class="toggle-row">
        <input type="checkbox" id="nameToggle" checked />
        <span>Show Name Tag</span>
      </label>
    </div>

    <label class="toggle-row">
      <input type="checkbox" id="seatToggle" checked />
      <span>Show Left/Right Seat Spots (ဘယ်/ညာ နေရာပြ)</span>
    </label>

    <div class="log" id="logBox">[Ready] ဘုရားရှင်၊ ပလ္လင်၊ ဘယ်/ညာ နေရာများနှင့် လှုပ်ရှားမှုပုံများ အသင့်ဖြစ်ပါပြီ။</div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const offeringAltar = document.getElementById("offeringAltar");
    const blessingBanner = document.getElementById("blessingBanner");
    const donorInput = document.getElementById("donorName");
    const outfitSelect = document.getElementById("outfitSelect");
    const offeringSelect = document.getElementById("offeringSelect");
    const enterBtn = document.getElementById("enterBtn");
    const bowAllBtn = document.getElementById("bowAllBtn");
    const clearBtn = document.getElementById("clearBtn");
    const speedSlider = document.getElementById("speedSlider");
    const speedVal = document.getElementById("speedVal");
    const voiceToggle = document.getElementById("voiceToggle");
    const nameToggle = document.getElementById("nameToggle");
    const seatToggle = document.getElementById("seatToggle");
    const logBox = document.getElementById("logBox");

    const TOTAL_PER_SIDE = 40;
    const seats = [];
    let devotees = [];
    let counter = 0;
    let walking = 0;
    let speed = 1.0;
    let bannerTimer = null;

    const OUTFIT_LIST = ["outfit-yawgi", "outfit-silk", "outfit-taikpon", "outfit-acheik"];
    const OUTFIT_NAMES = {
      "outfit-yawgi": "ယောဂီဝတ်စုံ",
      "outfit-silk": "ရွှေပိုးထည်",
      "outfit-taikpon": "တိုက်ပုံဝတ်စုံ",
      "outfit-acheik": "ချိတ်ထဘီဝတ်စုံ"
    };

    const speechQueue = [];
    let isSpeaking = false;

    function speakPrayer(name, offeringType) {
      if (!voiceToggle.checked || !("speechSynthesis" in window)) return;
      let itemText = "ဆီမီးနှင့် ပန်းများ";
      if (offeringType === "lamp") itemText = "ဆီမီး";
      if (offeringType === "flower") itemText = "ပန်းမန်များ";

      const text = `${name} က ${itemText} ကပ်လှူပူဇော်ပါသည်၊ ကိုယ်စိတ်နှစ်ဖြာ ကျန်းမာချမ်းသာပါစေ။`;
      speechQueue.push(text);
      processSpeechQueue();
    }

    function processSpeechQueue() {
      if (isSpeaking || speechQueue.length === 0) return;
      isSpeaking = true;
      const msg = new SpeechSynthesisUtterance(speechQueue.shift());
      const voices = window.speechSynthesis.getVoices();
      const myVoice = voices.find(v => v.lang && v.lang.toLowerCase().includes("my"));
      if (myVoice) msg.voice = myVoice;
      msg.lang = myVoice ? myVoice.lang : "my-MM";
      msg.rate = 0.95;
      msg.onend = () => { isSpeaking = false; processSpeechQueue(); };
      msg.onerror = () => { isSpeaking = false; processSpeechQueue(); };
      window.speechSynthesis.speak(msg);
    }

    function showBlessing(text) {
      blessingBanner.textContent = text;
      blessingBanner.classList.add("show");
      clearTimeout(bannerTimer);
      bannerTimer = setTimeout(() => {
        blessingBanner.classList.remove("show");
      }, 3000);
    }

    setInterval(() => {
      const sp = document.createElement("div");
      sp.className = "incense-particle";
      sp.textContent = Math.random() > 0.45 ? "✦" : "☁️";
      sp.style.setProperty("--drift", `${(Math.random() * 34 - 17).toFixed(0)}px`);
      stage.appendChild(sp);
      setTimeout(() => sp.remove(), 2400);
    }, 800);

    function triggerOfferingEffect(type) {
      const itemsToOffer = type === "both" ? ["lamp", "flower"] : [type];
      itemsToOffer.forEach((item, idx) => {
        const flyer = document.createElement("div");
        flyer.className = "flying-offering";
        flyer.textContent = item === "lamp" ? "🕯️" : "🪷";
        flyer.style.marginLeft = idx === 0 ? "-10px" : "10px";
        stage.appendChild(flyer);
        setTimeout(() => flyer.remove(), 850);

        setTimeout(() => {
          if (offeringAltar.children.length >= 12) {
            offeringAltar.removeChild(offeringAltar.firstChild);
          }
          if (item === "lamp") {
            const lamp = document.createElement("div");
            lamp.className = "altar-lamp";
            const flame = document.createElement("div");
            flame.className = "altar-flame";
            lamp.appendChild(flame);
            offeringAltar.appendChild(lamp);
          } else {
            const flowers = ["🪷", "🌸", "🌼", "🌺"];
            const flw = document.createElement("div");
            flw.className = "altar-flower";
            flw.textContent = flowers[Math.floor(Math.random() * flowers.length)];
            offeringAltar.appendChild(flw);
          }
        }, 450);
      });
    }

    // အလယ်ကော်ဇော ဘယ်/ညာ ၂ ဖက်တွင် ထိုင်မည့်နေရာ (Left 40 / Right 40)
    function buildSeats() {
      seats.length = 0;
      stage.querySelectorAll(".seat-spot").forEach(n => n.remove());

      const rows = 10;
      const cols = 4;
      for (let r = 0; r < rows; r++) {
        const y = 49 + r * 4.6;
        // ဘယ်ဘက် (Left side of carpet)
        for (let c = 0; c < cols; c++) {
          const x = 10 + c * 6.2;
          const spotEl = document.createElement("div");
          spotEl.className = "seat-spot";
          spotEl.style.left = `${x}%`;
          spotEl.style.top = `${y}%`;
          stage.appendChild(spotEl);
          seats.push({ side: "L", index: r * cols + c + 1, x, y, taken: false, spotEl });
        }
        // ညာဘက် (Right side of carpet)
        for (let c = 0; c < cols; c++) {
          const x = 67 + c * 6.2;
          const spotEl = document.createElement("div");
          spotEl.className = "seat-spot";
          spotEl.style.left = `${x}%`;
          spotEl.style.top = `${y}%`;
          stage.appendChild(spotEl);
          seats.push({ side: "R", index: r * cols + c + 1, x, y, taken: false, spotEl });
        }
      }
    }

    function updateStats() {
      const leftTaken = seats.filter(s => s.side === "L" && s.taken).length;
      const rightTaken = seats.filter(s => s.side === "R" && s.taken).length;
      document.getElementById("leftCount").textContent = `${leftTaken} / ${TOTAL_PER_SIDE}`;
      document.getElementById("rightCount").textContent = `${rightTaken} / ${TOTAL_PER_SIDE}`;
      document.getElementById("walkingCount").textContent = walking;
    }

    function addLog(msg) {
      const time = new Date().toLocaleTimeString("en-GB", { hour12: false });
      logBox.innerHTML = `<div>[${time}] ${msg}</div>` + logBox.innerHTML;
    }

    const wait = (ms) => new Promise(res => setTimeout(res, ms / speed));

    async function spawnDevotee() {
      const seat = seats.find(s => !s.taken);
      if (!seat) {
        addLog("နေရာ ၈၀ ပြည့်သွားပါပြီ။");
        return;
      }
      seat.taken = true;
      seat.spotEl.classList.add("taken");
      counter++;
      walking++;
      updateStats();

      const typedName = donorInput.value.trim();
      const name = typedName || `ဧည့်သည် #${counter}`;
      if (typedName) donorInput.value = "";

      let chosenOutfit = outfitSelect.value;
      if (chosenOutfit === "random") {
        chosenOutfit = OUTFIT_LIST[Math.floor(Math.random() * OUTFIT_LIST.length)];
      }
      const chosenOffering = offeringSelect.value;
