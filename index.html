<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI TikTok Live ဆုတောင်းပူဇော်ပွဲ</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #0d0b09;
      color: #f7efe2;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      gap: 10px;
    }

    .stage {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 9 / 16;
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 2px solid #b38738;
      background: url("bg_hall.png") center / 100% 100% no-repeat,
                  linear-gradient(180deg, #2e1b0d 0%, #120a05 100%);
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.75);
    }

    .offering-flash {
      position: absolute;
      top: 41%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(25, 11, 4, 0.88);
      border: 1px solid #f5c85c;
      color: #ffe8a3;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11px;
      z-index: 15;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      white-space: nowrap;
    }

    .offering-flash.show {
      opacity: 1;
    }

    .blessing-card {
      position: absolute;
      top: 47%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 92%;
      background: rgba(18, 8, 3, 0.92);
      border: 1px solid #f0c25b;
      border-radius: 12px;
      padding: 8px 12px;
      text-align: center;
      z-index: 25;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }

    .blessing-card.active {
      opacity: 1;
    }

    .blessing-title {
      font-size: 12px;
      color: #ffd97d;
      font-weight: 700;
    }

    .blessing-text {
      font-size: 11.5px;
      color: #fff7e6;
      margin-top: 3px;
      line-height: 1.45;
    }

    .devotee {
      position: absolute;
      width: 34px;
      height: 34px;
      transform: translate(-50%, -50%);
      z-index: 12;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: left 0.85s ease-in-out, top 0.85s ease-in-out;
    }

    .devotee img {
      width: 26px;
      height: 26px;
      object-fit: contain;
      pointer-events: none;
      transform: rotate(0deg);
      transition: transform 0.3s ease;
    }

    .devotee.walking img {
      animation: walkStep 0.35s ease-in-out infinite alternate;
    }

    .devotee.bowing img {
      animation: bowProstrate 0.9s ease-in-out infinite alternate;
    }

    .devotee-name {
      position: absolute;
      top: -13px;
      background: rgba(0, 0, 0, 0.82);
      color: #ffe599;
      font-size: 8.5px;
      padding: 1px 5px;
      border-radius: 4px;
      white-space: nowrap;
    }

    @keyframes walkStep {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(-2px) scale(1.04); }
    }

    @keyframes bowProstrate {
      0% { transform: translateY(0px) scale(1); }
      100% { transform: translateY(2px) scale(0.92); }
    }

    .controls {
      width: 100%;
      max-width: 420px;
      background: #1b1714;
      border: 1px solid #382f26;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .row {
      display: flex;
      gap: 8px;
    }

    input, select, button {
      border-radius: 8px;
      border: 1px solid #4c4033;
      padding: 8px 10px;
      font-size: 12px;
    }

    input, select {
      background: #110e0c;
      color: #fff;
      flex: 1;
    }

    button {
      background: linear-gradient(90deg, #e5a93c, #c47d19);
      color: #191105;
      font-weight: 700;
      border: none;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-dark {
      background: #2c2620;
      color: #f5efe6;
      border: 1px solid #4c4033;
    }

    .feed {
      background: #110e0c;
      border-radius: 8px;
      padding: 8px;
      font-size: 11px;
      color: #a9e5a9;
      max-height: 95px;
      overflow-y: auto;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="stage" id="stage">
    <div class="offering-flash" id="offeringFlash"></div>
    <div class="blessing-card" id="blessingCard">
      <div class="blessing-title" id="blessingTitle"></div>
      <div class="blessing-text" id="blessingText"></div>
    </div>
  </div>

  <div class="controls">
    <div class="row">
      <input id="viewerName" type="text" placeholder="လှူဒါန်းသူ နာမည်ထည့်ပါ (ဥပမာ - ကိုကို)" />
      <select id="giftType">
        <option value="Rose">🌹 နှင်းဆီပန်း (x1)</option>
        <option value="Lotus">🪷 ကြာပန်း (x5)</option>
        <option value="Incense">🕯️ ဆီမီးအလှူ (x10)</option>
        <option value="Universe">🌌 စကြဝဠာပူဇော်ပွဲ (x50)</option>
      </select>
    </div>

    <div class="row">
      <button id="sendGiftBtn">🎁 လက်ဆောင်ပို့မည်</button>
      <button class="btn-dark" id="autoSimBtn">▶ အလိုအလျောက်စမ်းရန်</button>
      <button class="btn-dark" id="resetBtn">↺ ပြန်စရန်</button>
    </div>

    <div class="row">
      <input id="wsUrl" type="text" placeholder="WebSocket လိပ်စာ (ဥပမာ - ws://localhost:8080)" />
      <button class="btn-dark" id="connectWsBtn">ချိတ်ဆက်ရန်</button>
    </div>

    <div class="feed" id="feed">တိုက်ရိုက်ပူဇော်မှုများ စတင်ရန် အဆင်သင့်ဖြစ်ပါပြီ။</div>
  </div>

  <script>
    const stage = document.getElementById("stage");
    const offeringFlash = document.getElementById("offeringFlash");
    const blessingCard = document.getElementById("blessingCard");
    const blessingTitle = document.getElementById("blessingTitle");
    const blessingText = document.getElementById("blessingText");
    const viewerNameInput = document.getElementById("viewerName");
    const giftTypeSelect = document.getElementById("giftType");
    const feed = document.getElementById("feed");

    const sampleNames = [
      "မောင်မောင်", "မစုစု", "ကိုမင်းမင်း", "မသန္တာ",
      "ကိုအောင်အောင်", "မနှင်းဝေ", "ကိုဇေယျာ", "မမြမြ"
    ];

    const giftMeta = {
      Rose: {
        label: "နှင်းဆီပန်း",
        offering: "🌸 နှင်းဆီပန်း လှူဒါန်းနေပါသည်",
        prayers: [
          "ပန်းကဲ့သို့ မွှေးပျံ့သင်းကြိုင်သော သီလ၊ သမာဓိ၊ ပညာဂုဏ်များနှင့် ပြည့်စုံပါစေ။",
          "စိတ်နှလုံး အေးချမ်းသာယာပြီး ကောင်းကျိုးလိုရာဆန္ဒများ ပြည့်ဝပါစေ။"
        ]
      },
      Lotus: {
        label: "ကြာပန်း",
        offering: "🪷 ကြာပန်း လှူဒါန်းနေပါသည်",
        prayers: [
          "ရွှံ့ညွန်မလူး ကြာပန်းကဲ့သို့ လောကဓံအလယ်တွင် စိတ်ကြည်လင် အေးချမ်းပါစေ။",
          "ဘေးရန်ကင်းကွာ ကျန်းမာချမ်းသာ၍ မင်္ဂလာအဖြာဖြာနှင့် ပြည့်စုံပါစေ။"
        ]
      },
      Incense: {
        label: "ဆီမီးအလှူ",
        offering: "🕯️ ဆီမီး လှူဒါန်းနေပါသည်",
        prayers: [
          "ဆီမီးတိုင်အလင်းကဲ့သို့ အသိဉာဏ်ပညာ ထွန်းလင်းတောက်ပပြီး လမ်းမှန်ရောက်ပါစေ။",
          "အမှောင်ခွင်း၍ အလင်းဆောင်နိုင်သော ကုသိုလ်ကောင်းမှုများ တိုးပွားပါစေ။"
        ]
      },
      Universe: {
        label: "စကြဝဠာပူဇော်ပွဲ",
        offering: "🕯️🌸 စကြဝဠာပူဇော်ပွဲ လှူဒါန်းနေပါသည်",
        prayers: [
          "စကြဝဠာတစ်ခွင် မေတ္တာဓာတ်ပျံ့နှံ့ပြီး စီးပွားလာဘ်လာဘ အထူးတိုးတက်ပါစေ။",
          "မိသားစုနှင့်တကွ ကိုယ်စိတ်နှစ်ဖြာ ကျန်းမာချမ်းသာ၍ လိုရာဆန္ဒ အမြန်ပြည့်စုံပါစေ။"
        ]
      }
    };

    // ဘယ်ဘက်နှင့် ညာဘက် ကော်ဇောပေါ်ရှိ နေရာများ (အပေါ်မှအောက်သို့ တန်းစီ)
    const spots = [];
    for (let r = 0; r < 5; r++) {
      const y = 55 + r * 7.8;
      for (let c = 0; c < 4; c++) {
        spots.push({ x: 18 + c * 5.6, y, taken: false }); // ဘယ်ဘက်ကော်ဇော
        spots.push({ x: 60 + c * 5.6, y, taken: false }); // ညာဘက်ကော်ဇော
      }
    }

    let placed = [];
    let autoTimer = null;
    let socket = null;

    function logEvent(msg) {
      const t = new Date().toLocaleTimeString("en-GB", { hour12: false });
      feed.innerHTML = `<div>[${t}] ${msg}</div>` + feed.innerHTML;
    }

    function speakMyanmarIfSupported(text) {
      if (!("speechSynthesis" in window)) return;
      const voices = window.speechSynthesis.getVoices();
      const myVoice = voices.find(v => v.lang && v.lang.toLowerCase().startsWith("my"));
      if (!myVoice) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.voice = myVoice;
      utter.lang = myVoice.lang;
      window.speechSynthesis.speak(utter);
    }

    function showBlessing(name, giftKey) {
      const info = giftMeta[giftKey] || giftMeta.Rose;
      const prayer = info.prayers[Math.floor(Math.random() * info.prayers.length)];
      const fullText = `${name} ၏ ${info.label} လှူဒါန်းမှုကြောင့် — ${prayer}`;

      blessingTitle.textContent = `🙏 ${name} (${info.label} လှူဒါန်းမှု) ဆုတောင်း`;
      blessingText.textContent = prayer;
      blessingCard.classList.add("active");
      speakMyanmarIfSupported(fullText);

      setTimeout(() => {
        blessingCard.classList.remove("active");
      }, 3600);
    }

    function showOfferingStatus(text) {
      offeringFlash.textContent = text;
      offeringFlash.classList.add("show");
      setTimeout(() => {
        offeringFlash.classList.remove("show");
      }, 1500);
    }

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function handleGiftEvent(name, giftKey) {
      const cleanName = (name || "").trim() || sampleNames[Math.floor(Math.random() * sampleNames.length)];
      const validKey = giftMeta[giftKey] ? giftKey : "Rose";
      const info = giftMeta[validKey];

      let spot = spots.find(s => !s.taken);
      if (!spot && placed.length > 0) {
        const oldest = placed.shift();
        oldest.el.remove();
        oldest.spot.taken = false;
        spot = oldest.spot;
      }
      if (!spot) return;

      spot.taken = true;
      const imgSrc = Math.random() > 0.5 ? "man_bow.png" : "woman_bow.png";

      const el = document.createElement("div");
      el.className = "devotee walking";
      el.style.left = "50%";
      el.style.top = "95%";
      el.innerHTML = `<span class="devotee-name">${cleanName}</span><img src="${imgSrc}" alt="${cleanName}" />`;
      stage.appendChild(el);
      placed.push({ el, spot });

      logEvent(`${cleanName} (${info.label}) သည် အလယ်လမ်းမှ ဘုရားရှင်ထံ လျှောက်သွားနေပါသည်။`);

      // ၁။ အလယ်လမ်းမှ ဘုရားရှေ့ (ပန်း/ဆီမီး လှူဒါန်းရာနေရာ) သို့ လမ်းလျှောက်သွားခြင်း
      await sleep(50);
      el.style.left = "50%";
      el.style.top = "49%";
      await sleep(900);

      // ၂။ ပန်း၊ ဆီမီး လှူဒါန်းခြင်း
      el.classList.remove("walking");
      showOfferingStatus(`${cleanName} — ${info.offering}`);
      logEvent(`${cleanName} သည် ${info.offering}။`);
      await sleep(950);

      // ၃။ ကော်ဇောပေါ်ရှိ မိမိနေရာသို့ ပြန်လာခြင်း
      el.classList.add("walking");
      el.style.left = `${spot.x}%`;
      el.style.top = `${spot.y}%`;
      await sleep(900);

      // ၄။ နေရာတွင် ဦးချကန်တော့ခြင်းနှင့် ဆုတောင်းပြသခြင်း
      el.classList.remove("walking");
      el.classList.add("bowing");
      showBlessing(cleanName, validKey);
      logEvent(`${cleanName} သည် ကော်ဇောပေါ်တွင် ဦးချကန်တော့ပြီး ဆုတောင်းနေပါသည်။`);
    }

    document.getElementById("sendGiftBtn").addEventListener("click", () => {
      handleGiftEvent(viewerNameInput.value, giftTypeSelect.value);
      viewerNameInput.value = "";
    });

    document.getElementById("autoSimBtn").addEventListener("click", (e) => {
      if (autoTimer) {
        clearInterval(autoTimer);
        autoTimer = null;
        e.target.textContent = "▶ အလိုအလျောက်စမ်းရန်";
        logEvent("အလိုအလျောက်စမ်းသပ်မှုကို ရပ်နားလိုက်ပါပြီ။");
      } else {
        const keys = Object.keys(giftMeta);
        autoTimer = setInterval(() => {
          const randomGift = keys[Math.floor(Math.random() * keys.length)];
          handleGiftEvent("", randomGift);
        }, 3600);
        e.target.textContent = "❚❚ ရပ်နားရန်";
        logEvent("အလိုအလျောက်စမ်းသပ်မှု စတင်ပါပြီ။");
      }
    });

    document.getElementById("resetBtn").addEventListener("click", () => {
      placed.forEach(item => item.el.remove());
      placed = [];
      spots.forEach(s => (s.taken = false));
      blessingCard.classList.remove("active");
      offeringFlash.classList.remove("show");
      logEvent("မျက်နှာပြင်ကို မူလအတိုင်း ပြန်လည်ရှင်းလင်းလိုက်ပါပြီ။");
    });

    document.getElementById("connectWsBtn").addEventListener("click", () => {
      const url = document.getElementById("wsUrl").value.trim();
      if (!url) return;
      if (socket) socket.close();
      socket = new WebSocket(url);
      socket.onopen = () => logEvent(`WebSocket ချိတ်ဆက်ပြီးပါပြီ: ${url}`);
      socket.onmessage = (event) => {
        try {
          const data = JSON.parse(event.data);
          if (data.username || data.giftName) {
            handleGiftEvent(data.username, data.giftName);
          }
        } catch (_) {}
      };
      socket.onclose = () => logEvent("WebSocket ချိတ်ဆက်မှု ပိတ်သွားပါပြီ။");
    });
  </script>
</body>
</html>
